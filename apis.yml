aid: doorstep
name: Doorstep
description: >-
  Doorstep (doorstep.ai) is an indoor precision-tracking platform for last-mile
  delivery. Its patent-pending Dropoff SDK runs on a delivery driver's smartphone
  and uses sensor fusion to detect delivery events indoors — parking location,
  building entrance, elevator or staircase, floor level, and the final doorstep —
  even in GPS-degraded environments where satellite positioning fails. The platform
  gives delivery operators and support teams building-level visibility to reduce
  delivery failures and refund fraud (which the company estimates costs the industry
  over ten billion dollars a year), measure timing metrics such as parking duration,
  guide drivers to precise waypoints, and surface operational performance gaps. The
  Dropoff SDK ships for React Native, Flutter, Capacitor, native iOS, and native
  Android, works on 99% of mainstream devices, and integrates in four touchpoints:
  set the API key, request permissions, start delivery tracking, mark the drop-off,
  and stop tracking. Doorstep raised an $8M seed round led by Canaan Partners in
  September 2025 and its system is live across most U.S. states.
